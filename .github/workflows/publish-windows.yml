name: Publish Windows portable release
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/publish-windows.yml"]
permissions:
  contents: write
concurrency:
  group: windows-portable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build, verify and publish portable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./maintenance/build-release.ps1 -Publish
